<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google AI Smart Flashcard</title>
    <!-- Google Material Icons & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Google AI Smart Flashcard</h1>
        <p class="subtitle">Học từ vựng thông minh với trợ lý AI và Cloud Database</p>

        <!-- Khu vực Input -->
        <div class="input-section">
            <input type="text" id="wordInput" placeholder="Nhập từ vựng tiếng Anh (VD: resilient)...">
            <button id="generateBtn">
                <span id="btnText">Generate with AI</span>
                <span id="loadingSpinner" class="hidden">Đang xử lý...</span>
            </button>
        </div>

        <!-- Khu vực hiển thị danh sách Flashcard -->
        <div id="flashcardContainer" class="flashcard-grid">
            <!-- Các thẻ Flashcard sẽ được render tự động ở đây bằng JavaScript -->
        </div>
    </div>

    <!-- File Logic JavaScript -->
    <script src="app.js"></script>
</body>
</html>
